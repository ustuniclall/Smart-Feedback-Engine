server:
  port: 8080


spring:
  application:
    name: smart-feedback-engine
  servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/feedback_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Python Yapay Zeka Mikroservis URL'i
ai-service:
  url: http://localhost:5000/predict

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
